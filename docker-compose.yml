version: '3.8'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/express_app
      - JWT_SECRET=changeme
      - REDIS_URL=redis://redis:6379
      - AWS_ACCESS_KEY_ID=
      - AWS_SECRET_ACCESS_KEY=
      - AWS_REGION=us-east-1
      - S3_BUCKET=
      - SWAGGER_ENABLED=true
    depends_on:
      - mongo
      - redis
  mongo:
    image: mongo:7
    restart: always
    volumes:
      - mongo-data:/data/db
  redis:
    image: redis:7-alpine
    restart: always
volumes:
  mongo-data:
